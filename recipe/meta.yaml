{% set name = "libbson" %}
{% set version = "2.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/mongodb/mongo-c-driver/releases/download/{{ version }}/mongo-c-driver-{{ version }}.tar.gz
  sha256: a9fdbccd14db36db08f1bc05949db54521662a1f0e231a8172b42bf608427665

build:
  number: 0
  # libbson 2.x installs libbson2 with SOVERSION 2 and is ABI-stable within the
  # major version, so pin on the major only.
  run_exports:
    - {{ pin_subpackage(name, max_pin='x') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - cmake
    - ninja

test:
  commands:
    - test -f ${PREFIX}/include/bson-{{ version }}/bson/bson.h    # [unix]
    - test -f ${PREFIX}/lib/pkgconfig/bson2.pc                    # [unix]
    - test -f ${PREFIX}/lib/libbson2${SHLIB_EXT}                  # [unix]
    - test ! -f ${PREFIX}/lib/libbson2.a                          # [unix]
    - pkg-config --exists "bson2 >= {{ version }}"                # [unix]
    - if not exist %LIBRARY_INC%\bson-{{ version }}\bson\bson.h (exit 1)  # [win]
    - if not exist %LIBRARY_LIB%\bson2.dll.lib (exit 1)                   # [win]
    - if not exist %LIBRARY_BIN%\bson2.dll (exit 1)                       # [win]
  requires:
    - pkg-config  # [unix]

about:
  home: https://github.com/mongodb/mongo-c-driver
  license: Apache-2.0
  license_file: COPYING
  summary: A library providing useful routines related to building, parsing, and iterating BSON documents.

extra:
  recipe-maintainers:
    - aclark4life
    - blink1073
    - caseyclements
